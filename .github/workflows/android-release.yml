name: Android TV release

# Push a tag like android-v0.1.0 to build a release APK signed with your own
# key and attach it to a GitHub Release. Needs the four KINORA_* secrets
# described in clients/android/README.md.
on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KINORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The KINORA_KEYSTORE_BASE64 secret is missing. See clients/android/README.md (Release signing)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        env:
          KINORA_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KINORA_KEYSTORE_PASSWORD: ${{ secrets.KINORA_KEYSTORE_PASSWORD }}
          KINORA_KEY_ALIAS: ${{ secrets.KINORA_KEY_ALIAS }}
          KINORA_KEY_PASSWORD: ${{ secrets.KINORA_KEY_PASSWORD }}
        run: |
          export KINORA_VERSION_CODE=$(( ($(date +%s) - 1767225600) / 10 ))
          export KINORA_VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          ./gradlew test :app-tv:assembleRelease
          cp app-tv/build/outputs/apk/release/app-tv-release.apk "kinora-tv-$KINORA_VERSION_NAME.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" kinora-tv-*.apk \
            --title "Kinora for Android TV ${GITHUB_REF_NAME#android-v}" \
            --notes "Sideload this APK on your Android TV. See clients/android/README.md for install steps."

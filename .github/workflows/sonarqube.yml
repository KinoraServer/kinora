# SonarQube Cloud (free for public repositories): bugs, code smells, duplication,
# complexity and coverage for Rust, TypeScript, Kotlin and more, with a quality
# gate on every pull request. Settings: sonar-project.properties.
# Setup: docs/code-quality.md. Until the SONAR_TOKEN secret exists, the scan is
# skipped and the job still passes.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for the SONAR_TOKEN secret
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set (or this is a pull request from a fork), so the SonarQube scan is skipped. See docs/code-quality.md."

      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          # Full history, so SonarQube can tell new code from old and blame lines.
          fetch-depth: 0

      # Rust: Clippy findings and test coverage.
      - uses: dtolnay/rust-toolchain@stable
        if: env.SONAR_TOKEN != ''
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: env.SONAR_TOKEN != ''
      - uses: taiki-e/install-action@v2
        if: env.SONAR_TOKEN != ''
        with:
          tool: cargo-llvm-cov
      - name: Clippy report
        if: env.SONAR_TOKEN != ''
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json
      - name: Rust coverage
        if: env.SONAR_TOKEN != ''
        run: cargo llvm-cov --workspace --lcov --output-path rust-lcov.info

      # Web: unit test coverage (the Storybook browser tests run in the CI workflow).
      - uses: pnpm/action-setup@v6
        if: env.SONAR_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web coverage
        if: env.SONAR_TOKEN != ''
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run --project unit --coverage.enabled --coverage.provider=v8 \
            --coverage.reporter=lcov --coverage.include='src/**'
          # Vitest writes paths relative to web/; SonarQube reads them from the repo root.
          sed -i 's#^SF:src/#SF:web/src/#' coverage/lcov.info

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

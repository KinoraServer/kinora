name: Android TV

on:
  push:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew :app-tv:lintDebug
      - name: Build APK
        env:
          KINORA_VERSION_NAME: 0.1.0-dev.${{ github.run_number }}
        run: |
          # Always increasing, so every newer build installs over an older one.
          export KINORA_VERSION_CODE=$(( ($(date +%s) - 1767225600) / 10 ))
          ./gradlew :app-tv:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinora-tv-dev-${{ github.run_number }}
          path: clients/android/app-tv/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: clients/android/app-tv/build/reports/lint-results-debug.html
          if-no-files-found: ignore

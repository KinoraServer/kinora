# SonarQube Cloud analysis settings, used by .github/workflows/sonarqube.yml.
# Setup steps (project import, SONAR_TOKEN secret) are in docs/code-quality.md.

# The organization and project key SonarQube Cloud gave this repo when it was imported.
sonar.organization=kinoraserver
sonar.projectKey=KinoraServer_kinora
sonar.projectName=Kinora

sonar.sourceEncoding=UTF-8

# Code: Rust server, React web app, Android TV client, scripts.
sonar.sources=crates,web,clients/android,scripts,Dockerfile
sonar.tests=web/src,clients/android
sonar.test.inclusions=\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  clients/android/**/src/test/**
sonar.exclusions=\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  clients/android/**/src/test/**,\
  **/node_modules/**,\
  web/dist/**,\
  web/storybook-static/**,\
  web/coverage/**,\
  web/pnpm-lock.yaml,\
  clients/android/**/build/**,\
  crates/**/snapshots/**,\
  **/*.png,\
  **/*.svg

# Stories, Storybook setup and the Android client (no coverage collected yet)
# don't count against coverage.
sonar.coverage.exclusions=\
  web/src/**/*.stories.tsx,\
  web/src/stories/**,\
  web/.storybook/**,\
  web/vite.config.ts,\
  clients/android/**,\
  scripts/**,\
  crates/server/build.rs
# Stories repeat similar setup on purpose.
sonar.cpd.exclusions=web/src/**/*.stories.tsx

# Reports made by the workflow before the scan.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=rust-lcov.info
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

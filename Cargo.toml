[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin-api", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-2.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
